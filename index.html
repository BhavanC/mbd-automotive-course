<script>

/* =========================================================
   MODULE 1
   Exactly two lectures, as specified in the PDF:
   
   1. Lecture 1: Welcome to Module 1
   2. Lecture 2: Getting ready
   ========================================================= */

const course = [

{
  title:"Lecture 1: Welcome to Module 1",

  html:`

  <p>
    Learn to build your first working vehicle model in Simulink,
    close a control loop around it, and find the faults that break
    real models.
  </p>

  <table class="facts">

    <tr>
      <td>Time</td>
      <td>About 8 hours, over one week</td>
    </tr>

    <tr>
      <td>Level</td>
      <td>Beginner. No Simulink experience needed</td>
    </tr>

    <tr>
      <td>Format</td>
      <td>Written lessons, annotated screenshots and downloadable models</td>
    </tr>

    <tr>
      <td>Software</td>
      <td>MATLAB and Simulink. No extra toolboxes</td>
    </tr>

  </table>

  <h3>Why this module matters</h3>

  <p>
    Carmakers and EV companies design their control software in Simulink
    long before any code reaches a vehicle. They build a model, test it
    on a computer, and only then move to hardware. This approach is
    called model-based design, and it is one of the most asked-for
    skills in automotive engineering jobs.
  </p>

  <p>
    This module gives you the foundation. You won't just learn where
    the blocks are. You'll build a model of a vehicle, put a controller
    on it, and learn how to tell when a model is wrong.
  </p>

  <h3>What you'll be able to do</h3>

  <p>By the end of this module, you can:</p>

  <ul>
    <li>
      Build, run and read a Simulink model using the core blocks
    </li>

    <li>
      Choose sensible solver and step-size settings, and explain
      what happens when they are wrong
    </li>

    <li>
      Turn a vehicle equation into a working Simulink model
    </li>

    <li>
      Close a feedback loop and tune a PID controller against clear targets
    </li>

    <li>
      Organise a model into subsystems and drive it from a MATLAB script
    </li>

    <li>
      Find and fix common model faults, such as algebraic loops and
      unit mistakes
    </li>

    <li>
      Explain where model-based design fits in a vehicle development process
    </li>
  </ul>

  <p>
    That's what the module covers. In the next lecture, you'll set up
    everything you need to start.
  </p>

  `
},

{
  title:"Lecture 2: Getting ready",

  html:`

  <p>
    You now know what this module teaches and why it matters. This lecture
    covers what you need before the first lesson.
  </p>

  <h3>Before you start</h3>

  <h3>You should already know</h3>

  <ul>

    <li>
      Basic MATLAB: variables, vectors, plotting, writing a short script.
      If you need a refresher, use the free one-page Module 0 guide.
    </li>

    <li>
      First-year mechanics and calculus: Newton's second law and simple
      differential equations.
    </li>

  </ul>

  <h3>You don't need</h3>

  <ul>

    <li>Any earlier Simulink experience</li>

    <li>
      Control theory. The ideas are introduced when you need them.
    </li>

    <li>
      Extra toolboxes. Core MATLAB and Simulink are enough.
    </li>

  </ul>

  <h3>Getting the software</h3>

  <p>Pick whichever option works for you:</p>

  <ul>

    <li>
      <b>Your college licence:</b>
      many colleges hold a campus-wide MATLAB licence. Check with your
      department or computer centre; a short guide in the module shows
      how to activate it.
    </li>

    <li>
      <b>MATLAB Online:</b>
      runs in your browser, so it works on a low-spec laptop. Free usage
      hours are limited, so check MathWorks' current terms.
    </li>

  </ul>

  <p class="tag">
    Version note: all models are saved in an older release format so they
    open on most versions.
  </p>

  <h3>What you'll download</h3>

  <ul>

    <li>
      Starter and finished Simulink models (<code>.slx</code>) for each lesson
    </li>

    <li>
      MATLAB scripts (<code>.m</code>) with the parameters used in the models
    </li>

    <li>
      A one-page cheat sheet of Simulink shortcuts and common blocks (PDF)
    </li>

  </ul>

  <h3>How to get the most from this module</h3>

  <ul>

    <li>
      There are no videos. Read at your own pace and keep Simulink open
      beside the lesson.
    </li>

    <li>
      Build every model yourself before opening the finished version.
    </li>

    <li>
      Note down the mistakes you make. Each one you record is one you'll
      spot faster next time.
    </li>

  </ul>

  <p>
    <b>You're ready. Open Lesson 1.1 to begin.</b>
  </p>

  `
}

];


/* =========================================================
   NAVIGATION
   ========================================================= */

const nav = document.getElementById('nav');
const main = document.getElementById('main');
const pb = document.getElementById('pb');

let done = [];
let cur = 0;

try{
  done = JSON.parse(
    localStorage.getItem('sim-m1-done') || '[]'
  );
}catch(e){
  done = [];
}

function save(){

  try{
    localStorage.setItem(
      'sim-m1-done',
      JSON.stringify(done)
    );
  }catch(e){}

}

function renderNav(){

  nav.innerHTML = '';

  course.forEach((m,i)=>{

    const b = document.createElement('button');

    b.textContent = m.title;

    b.className =
      (i === cur ? 'on ' : '') +
      (done.includes(i) ? 'done' : '');

    b.onclick = ()=>{
      cur = i;
      show();
    };

    nav.appendChild(b);

  });

  pb.style.width =
    (done.length / course.length * 100) + '%';
}

function show(){

  const m = course[cur];

  main.innerHTML = `

    <h2>${m.title}</h2>

    ${m.html}

    <div class="row">

      ${
        cur > 0
        ? '<button class="btn alt" id="prev">← Previous</button>'
        : ''
      }

      <button class="btn" id="mark">
        ${
          done.includes(cur)
          ? 'Completed ✓'
          : 'Mark complete'
        }
      </button>

      ${
        cur < course.length - 1
        ? '<button class="btn alt" id="next">Next →</button>'
        : ''
      }

    </div>

  `;

  document.getElementById('mark').onclick = ()=>{

    if(!done.includes(cur)){
      done.push(cur);
    }

    save();
    show();

  };

  const p = document.getElementById('prev');
  const n = document.getElementById('next');

  if(p){
    p.onclick = ()=>{
      cur--;
      show();
    };
  }

  if(n){
    n.onclick = ()=>{
      cur++;
      show();
    };
  }

  renderNav();

  window.scrollTo({
    top:0
  });

}

show();

</script>
