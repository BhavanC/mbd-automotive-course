<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 1: Simulink Fundamentals for Automotive</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1d2430;--muted:#5d6878;--accent:#0b6bcb;--line:#e1e5ec;--ok:#1a8f4c}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--text:#e8ecf2;--muted:#9aa6b6;--accent:#5aa9ff;--line:#2a3441;--ok:#4cc27f}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:28px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0 0 4px;font-size:1.6rem}
header p{margin:0;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:14px;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:3px;transition:width .3s}
.wrap{display:flex;max-width:1100px;margin:0 auto;gap:24px;padding:20px}
nav{flex:0 0 260px}
nav button{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font:inherit;font-size:.93rem}
nav button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
nav button.done::after{content:" ✓";color:var(--ok)}
main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 28px}
main h2{margin-top:0}
main h3{margin-top:1.6em}
code,pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:.88rem}
code{padding:1px 5px}
pre{padding:12px;overflow-x:auto}
.tag{color:var(--muted);font-size:.85rem}
.facts{width:100%;border-collapse:collapse;margin:12px 0}.facts td{border:1px solid var(--line);padding:8px 12px}.facts td:first-child{font-weight:600;width:110px}
.video{aspect-ratio:16/9;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:10px}
.video iframe{width:100%;height:100%;border:0}
.quiz{border-top:1px solid var(--line);margin-top:28px;padding-top:8px}
.quiz label{display:block;padding:6px 0;cursor:pointer}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font:inherit}
.btn.alt{background:none;color:var(--accent)}
#fb{margin-top:8px;font-weight:600}
@media (max-width:760px){.wrap{flex-direction:column;padding:12px}nav{flex:none}main{padding:18px}}
  
</style>
</head>
<body>
<header>
  <h1>Module 1: Simulink Fundamentals for Automotive</h1>
  <p>Model-based design for automotive engineering: build, control and debug a vehicle model.</p>
  <div class="bar"><i id="pb"></i></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
  
/* ===== EDIT YOUR COURSE HERE =====
   Each item: title, html (content), optional quiz {q, options[], answer index} */
const lessons=[
 ["1.1","Build, run and read a Simulink model using the core blocks"],
 ["1.2","Choose sensible solver and step-size settings, and what happens when they are wrong"],
 ["1.3","Turn a vehicle equation into a working Simulink model"],
 ["1.4","Close a feedback loop and tune a PID controller against clear targets"],
 ["1.5","Organise a model into subsystems and drive it from a MATLAB script"],
 ["1.6","Find and fix common model faults: algebraic loops and unit mistakes"],
 ["1.7","Where model-based design fits in a vehicle development process"]
];
const course=[
{
 title:"Lecture 1: Welcome to Module 1",
 html:`<p>Learn to build your first working vehicle model in Simulink, close a control loop around it, and find the faults that break real models.</p>
 <table class="facts"><tr><td>Time</td><td>About 8 hours, over one week</td></tr>
 <tr><td>Level</td><td>Beginner. No Simulink experience needed</td></tr>
 <tr><td>Format</td><td>Written lessons, annotated screenshots and downloadable models</td></tr>
 <tr><td>Software</td><td>MATLAB and Simulink. No extra toolboxes</td></tr></table>
 <h3>Why this module matters</h3>
 <p>Carmakers and EV companies design their control software in Simulink long before any code reaches a vehicle. They build a model, test it on a computer, and only then move to hardware. This approach is called model-based design, and it is one of the most asked-for skills in automotive engineering jobs.</p>
 <p>This module gives you the foundation. You won't just learn where the blocks are. You'll build a model of a vehicle, put a controller on it, and learn how to tell when a model is wrong.</p>
 <h3>What you'll be able to do</h3>
 <ul>${lessons.map(l=>"<li>"+l[1]+"</li>").join("")}</ul>`
},
{
 title:"Lecture 2: Getting ready",
 html:`<h3>You should already know</h3>
 <ul><li>Basic MATLAB: variables, vectors, plotting, writing a short script (refresher: the free one-page Module 0 guide)</li>
 <li>First-year mechanics and calculus: Newton's second law and simple differential equations</li></ul>
 <h3>You don't need</h3>
 <ul><li>Any earlier Simulink experience</li><li>Control theory. The ideas are introduced when you need them</li><li>Extra toolboxes. Core MATLAB and Simulink are enough</li></ul>
 <h3>Getting the software</h3>
 <ul><li><b>Your college licence:</b> many colleges hold a campus-wide MATLAB licence. Check with your department or computer centre.</li>
 <li><b>MATLAB Online:</b> runs in your browser, so it works on a low-spec laptop. Free usage hours are limited, so check MathWorks' current terms.</li></ul>
 <p class="tag">Version note: all models are saved in an older release format so they open on most versions.</p>
 <h3>What you'll download</h3>
 <ul><li>Starter and finished Simulink models (<code>.slx</code>) for each lesson</li>
 <li>MATLAB scripts (<code>.m</code>) with the parameters used in the models</li>
 <li>A one-page cheat sheet of Simulink shortcuts and common blocks (PDF)</li></ul>
 <h3>How to get the most from this module</h3>
 <ul><li>There are no videos. Read at your own pace and keep Simulink open beside the lesson.</li>
 <li>Build every model yourself before opening the finished version.</li>
 <li>Note down the mistakes you make. Each one you record is one you'll spot faster next time.</li></ul>
 <p><b>You're ready. Open Lesson 1.1 to begin.</b></p>`
},
...lessons.map(l=>({
 title:"Lesson "+l[0],
 html:`<p class="tag">Coming soon</p><p><b>Goal:</b> ${l[1]}.</p>
 <p>Replace this text with the lesson: explanation, annotated screenshots, and download links for the starter and finished <code>.slx</code> models.</p>`
}))
];
/* ===== END EDIT ===== */

const nav=document.getElementById('nav'),main=document.getElementById('main'),pb=document.getElementById('pb');
let done=[],cur=0;
try{done=JSON.parse(localStorage.getItem('sim-m1-done')||'[]')}catch(e){}
function save(){try{localStorage.setItem('sim-m1-done',JSON.stringify(done))}catch(e){}}
function renderNav(){
  nav.innerHTML='';
  course.forEach((m,i)=>{
    const b=document.createElement('button');
    b.textContent=m.title;
    b.className=(i===cur?'on ':'')+(done.includes(i)?'done':'');
    b.onclick=()=>{cur=i;show()};
    nav.appendChild(b);
  });
  pb.style.width=(done.length/course.length*100)+'%';
}
function show(){
  const m=course[cur];
  let q='';
  if(m.quiz){
    const opts=m.quiz.options.map((o,i)=>`<label><input type="radio" name="q" value="${i}"> ${o}</label>`).join('');
    q=`<div class="quiz"><h3>Check your understanding</h3><p>${m.quiz.q}</p>${opts}<button class="btn alt" id="chk">Check answer</button><div id="fb"></div></div>`;
  }
  main.innerHTML=`<h2>${m.title}</h2>${m.html}${q}
  <div class="row">
    ${cur>0?'<button class="btn alt" id="prev">← Previous</button>':''}
    <button class="btn" id="mark">${done.includes(cur)?'Completed ✓':'Mark complete'}</button>
    ${cur<course.length-1?'<button class="btn alt" id="next">Next →</button>':''}
  </div>`;
  const c=document.getElementById('chk');
  if(c)c.onclick=()=>{
    const s=document.querySelector('input[name=q]:checked'),fb=document.getElementById('fb');
    fb.textContent=!s?'Pick an option first.':(+s.value===m.quiz.answer?'Correct ✓':'Not quite, try again.');
  };
  document.getElementById('mark').onclick=()=>{if(!done.includes(cur))done.push(cur);save();show()};
  const p=document.getElementById('prev'),n=document.getElementById('next');
  if(p)p.onclick=()=>{cur--;show()};
  if(n)n.onclick=()=>{cur++;show()};
  renderNav();
  window.scrollTo({top:0});
}
show();
</script>
</body>
</html>
